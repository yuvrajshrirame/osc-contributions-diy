name: Auto Merge Beginner PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Enable auto-merge for safe PRs
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;

            // Fetch the list of changed files in this PR
            const filesRes = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });

            const allowedFiles = ['CONTRIBUTORS.md', 'FUN_FACTS.md', 'README.md'];
            const changedFiles = filesRes.data.map(f => f.filename);
            const isSafe = changedFiles.length > 0 &&
                           changedFiles.every(f => allowedFiles.includes(f));

            if (!isSafe) {
              console.log(`⏭️ Skipped PR #${pr.number} — touches non-allowed files, needs manual review.`);
              console.log(`   Changed: ${changedFiles.join(', ')}`);
              return;
            }

            // Use GitHub's auto-merge feature so the merge is QUEUED and only
            // happens after all required status checks pass — not immediately.
            // Requires "Allow auto-merge" to be enabled in repo Settings → General.
            try {
              await github.graphql(`
                mutation EnableAutoMerge($prId: ID!) {
                  enablePullRequestAutoMerge(input: {
                    pullRequestId: $prId,
                    mergeMethod: SQUASH
                  }) {
                    pullRequest {
                      number
                      autoMergeRequest {
                        enabledAt
                      }
                    }
                  }
                }
              `, { prId: pr.node_id });

              console.log(`✅ Auto-merge enabled for PR #${pr.number} — will merge once all checks pass.`);
            } catch (err) {
              // Auto-merge may already be enabled, or repo setting is off — log but don't fail
              console.log(`⚠️ Could not enable auto-merge for PR #${pr.number}: ${err.message}`);
              console.log(`   Make sure "Allow auto-merge" is enabled in repo Settings → General.`);
            }
